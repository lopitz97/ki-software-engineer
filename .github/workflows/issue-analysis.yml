name: Issue Analysis with Claude

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

jobs:
  analyze-issue:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Analyze Issue with Claude
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
        with:
          openai-api-key: ${{ secrets.ANTHROPIC_API_KEY  }}
          permission-profile: ':workspace'
          model: "gpt-5.6-luna"
          prompt: |
            @clarify-feature

            Context:
            - REPO: ${{ github.repository }}
            - ISSUE: ${{ github.event.issue.number || github.event.comment.issue_url }}
