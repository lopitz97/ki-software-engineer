name: Auto-Fix CI Failures with Claude

on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types:
      - completed

jobs:
  auto-fix:
    # Only run if the CI workflow failed
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the SHA from the failed workflow run
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Prepare fix branch
        env:
          FIX_BRANCH: auto-fix/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --create "$FIX_BRANCH"
          mkdir -p tmp

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Codex
        run: |
          mkdir -p "$RUNNER_TEMP/codex-home"

          cat > "$RUNNER_TEMP/codex-home/config.toml" <<'EOF'
          default_permissions = "github-issues"

          [features]
          network_proxy = true

          [permissions.github-issues]
          extends = ":workspace"

          [permissions.github-issues.filesystem.":workspace_roots"]
          ".git" = "write"

          [permissions.github-issues.network]
          enabled = true

          [permissions.github-issues.network.domains]
          "api.github.com" = "allow"
          EOF

      - name: Run Codex Auto-Fix
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          openai-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          codex-home: ${{ runner.temp }}/codex-home
          permission-profile: github-issues
          safety-strategy: drop-sudo
          model: 'gpt-5.6-luna'
          prompt: |
            A CI build has failed. Analyze the errors and fix them automatically.

            **Build Details:**
            - Repository: ${{ github.repository }}
            - Workflow: ${{ github.event.workflow_run.name }}
            - Branch: ${{ github.event.workflow_run.head_branch }}
            - Commit: ${{ github.event.workflow_run.head_sha }}
            - Workflow Run URL: ${{ github.event.workflow_run.html_url }}

            **Your Task:**
            1. Download the workflow logs and analyze the errors
            2. Identify the root causes (build errors, linting problems, tests, etc.)
            3. Perform automatic fixes for:
               - YAML syntax errors in frontmatter
               - TypeScript/JavaScript errors
               - Import/export problems
               - Package.json dependencies
            4. Test the fixes locally with `npm run build`
            5. Commit the changes with a descriptive commit message
            6. Write tmp/auto-fix-summary.md in UTF-8 Markdown describing the root cause, the concrete changes,
               and the actual validation commands and results. Keep this report uncommitted.

            **Important Rules:**
            - Use Conventional Commits standard
            - ALWAYS test with `npm run build` before committing
            - If multiple fixes are needed, create separate commits
            - For critical errors, create an issue instead of auto-fixing
            - Stay on the prepared fix branch. Do not push or create a pull request; the workflow handles publication.

            **Example Commit Messages:**
            - `fix: yaml syntax error in blog frontmatter`
            - `chore: update dependencies to resolve build issues`

            Begin by analyzing the workflow logs!

      - name: Verify fixes with build test
        run: |
          echo "Testing if auto-fixes resolved the build issues..."
          npm run build

      - name: Create Pull Request if changes were made
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          BASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          FIX_BRANCH: auto-fix/${{ github.run_id }}-${{ github.run_attempt }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$FIX_BRANCH"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD

          if git diff --quiet "$SOURCE_SHA" HEAD; then
            echo "No fixes to publish."
            exit 0
          fi

          test -s tmp/auto-fix-summary.md
          REMOTE_SHA=$(git ls-remote --exit-code origin "refs/heads/$BASE_BRANCH" | cut -f1)
          if [[ "$REMOTE_SHA" != "$SOURCE_SHA" ]]; then
            echo "Source branch changed since the failed build; skipping stale fixes."
            exit 0
          fi

          {
            cat tmp/auto-fix-summary.md
            printf '\n\n## Validation\n\nThe workflow independently verified `npm run build` successfully.\n'
            printf '\n## Context\n\nFailed build: %s\n\nStarting commit: `%s`\n' "$FAILED_RUN_URL" "$SOURCE_SHA"
          } > "$RUNNER_TEMP/auto-fix-pr.md"

          git push origin "HEAD:refs/heads/$FIX_BRANCH"
          PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --head "$FIX_BRANCH" \
            --title "fix: repair CI failure on $BASE_BRANCH" --body-file "$RUNNER_TEMP/auto-fix-pr.md")
          gh pr view "$PR_URL" --repo "$GITHUB_REPOSITORY" --json url,baseRefName,headRefName
          printf 'Created auto-fix PR: %s\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    if: ${{ always() && needs.auto-fix.result == 'failure' }}
    needs: auto-fix
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue for failed auto-fix
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🤖 Auto-Fix Failed - Manual Intervention Required',
              body: `## Auto-Fix Error

            The automatic fix for the CI error has failed.

            **Details:**
            - Workflow: ${{ github.event.workflow_run.name }}
            - Branch: ${{ github.event.workflow_run.head_branch }}
            - Commit: ${{ github.event.workflow_run.head_sha }}
            - Auto-Fix Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Original Failed Run: ${{ github.event.workflow_run.html_url }}

            Please review the logs and fix the issues manually.`,
              labels: ['bug', 'auto-fix-failed', 'needs-attention']
            })
