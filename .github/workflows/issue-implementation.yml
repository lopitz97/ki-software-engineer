name: Issue Implementation Preparation

on:
  issues:
    types: [labeled]

jobs:
  prepare-implementation:
    if: github.event.label.name == 'ready-for-implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Codex
        run: |
          mkdir -p "$RUNNER_TEMP/codex-home"

          cat > "$RUNNER_TEMP/codex-home/config.toml" <<'EOF'
          default_permissions = "github-issues"

          [features]
          network_proxy = true

          [permissions.github-issues]
          extends = ":workspace"

          [permissions.github-issues.filesystem.":workspace_roots"]
          ".git" = "write"

          [permissions.github-issues.network]
          enabled = true

          [permissions.github-issues.network.domains]
          "api.github.com" = "allow"
          EOF

      - name: Prepare Feature Branch
        id: prepare-branch
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          SLUG=$(printf '%s' "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g; s/-\{1,\}/-/g; s/^-//; s/-$//' | cut -c1-60)
          SLUG=$(printf '%s' "$SLUG" | sed 's/-$//')
          BRANCH_NAME="feature/$ISSUE_NUMBER-${SLUG:-issue}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH_NAME"; then
            git switch --track --create "$BRANCH_NAME" "origin/$BRANCH_NAME"
          else
            git switch --create "$BRANCH_NAME" "origin/$BASE_BRANCH"
          fi
          printf 'branch_name=%s\n' "$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Implement Issue with Codex
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          openai-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          codex-home: ${{ runner.temp }}/codex-home
          permission-profile: github-issues
          safety-strategy: drop-sudo
          model: 'gpt-5.6-luna'
          prompt: |
            $ci-se-green

            Context:
            - REPO: ${{ github.repository }}
            - ISSUE_NUMBER: ${{ github.event.issue.number }}
            - BRANCH: ${{ steps.prepare-branch.outputs.branch_name }}

            Use these resolved context values; expressions inside SKILL.md are placeholders.
            Before implementing, verify that the current branch starts with feature/ followed by this issue number
            and a hyphen. If the feature branch has not been prepared, stop and report that prerequisite.
            Do not implement or commit on the default branch.
