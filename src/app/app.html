<header class="border-t-2 border-emerald-800 bg-white shadow-sm dark:border-emerald-400 dark:bg-gray-900">
  <div class="mx-auto max-w-7xl px-4 sm:px-6">
    <div class="flex flex-wrap items-center justify-between gap-x-8 gap-y-5 py-5 sm:py-6">
      <a
        routerLink="/"
        aria-label="BookMonkey home"
        class="flex items-center gap-3 rounded text-3xl font-extrabold tracking-tight text-gray-950 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-emerald-700 dark:text-white dark:focus-visible:outline-emerald-300 sm:text-4xl"
      >
        <svg
          aria-hidden="true"
          class="h-10 w-10 text-emerald-800 dark:text-emerald-400"
          viewBox="0 0 32 32"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linejoin="round"
        >
          <path d="M16 8C12 5 7 4 2 5v21c5-1 10 0 14 3 4-3 9-4 14-3V5c-5-1-10 0-14 3Zm0 0v21" />
          <path d="m6 11 6 2m-6 4 6 2m8-6 6-2m-6 8 6-2" />
        </svg>
        BookMonkey
      </a>
      <form
        role="search"
        aria-label="Catalogue"
        (submit)="searchBooks($event, catalogueQuery.value)"
        class="order-last flex w-full items-center rounded-full border-2 border-gray-300 bg-white px-4 focus-within:border-emerald-700 dark:border-gray-600 dark:bg-gray-900 dark:focus-within:border-emerald-300 md:order-none md:w-auto md:max-w-xl md:flex-1"
      >
        <label for="catalogue-search" class="sr-only">Search catalogue</label>
        <input
          #catalogueQuery
          id="catalogue-search"
          type="text"
          [value]="search.query()"
          (input)="search.change($event.target.value)"
          placeholder="Title, author, keyword, ISBN"
          class="min-w-0 flex-1 rounded-full bg-transparent py-3 text-gray-900 placeholder:text-gray-500 focus-visible:outline-2 focus-visible:outline-emerald-700 dark:text-gray-100 dark:placeholder:text-gray-400 dark:focus-visible:outline-emerald-300"
        />
        @if (search.query()) {
          <button
            type="button"
            aria-label="Clear search"
            (click)="search.change(''); catalogueQuery.focus()"
            class="ml-2 rounded-full p-2 text-gray-600 hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-700 dark:text-gray-300 dark:hover:bg-gray-800 dark:focus-visible:outline-emerald-300"
          >
            <svg aria-hidden="true" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-width="1.5" d="m6 6 12 12M6 18 18 6" />
            </svg>
          </button>
        }
        <button
          type="submit"
          aria-label="Search catalogue"
          class="ml-2 rounded-full p-2 text-emerald-800 hover:bg-emerald-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-700 dark:text-emerald-300 dark:hover:bg-gray-800 dark:focus-visible:outline-emerald-300"
        >
          <svg
            aria-hidden="true"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <circle cx="10.5" cy="10.5" r="7.5" />
            <path stroke-linecap="round" d="m16 16 5 5" />
          </svg>
        </button>
      </form>
      <app-theme-control />
    </div>
    <nav aria-label="Categories" class="flex gap-6">
      <a
        routerLink="/"
        class="border-b-2 border-emerald-800 px-1 pb-3 pt-1 text-base font-semibold text-gray-900 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-emerald-700 dark:border-emerald-400 dark:text-gray-100 dark:focus-visible:outline-emerald-300"
        >Bücher</a
      >
    </nav>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="bg-gray-100 mt-12 dark:bg-gray-900">
  <div class="container mx-auto px-4 py-6">
    <p class="text-center text-gray-600 text-sm dark:text-gray-300">
      © 2023 BookMonkey App - Angular Workshop by workshops.de
    </p>
  </div>
</footer>
